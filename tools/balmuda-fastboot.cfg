# Zadig Device > Load Preset Device. Use WinUSB for this non-composite bootloader.
# The Android interface GUID is required by fastboot's Windows AdbWinApi backend.
# Source: https://github.com/pbatard/libwdi/wiki/Zadig#example-of-a-zadig-preset-device-config-file
[device]
Description = "Android Bootloader Interface"
VID = 0x18D1
PID = 0xD00D
GUID = "{F72FE0D4-CBCB-407D-8814-9ED673D0DD6B}"
